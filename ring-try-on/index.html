<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MIA Live Ring Try-On</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;height:100svh;margin:auto;position:relative;overflow:hidden;background:#15110f}.screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:none;background:#201b19}.screen.mirrored{transform:scaleX(-1)}.canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.top{position:absolute;z-index:5;inset:0 0 auto;height:76px;display:flex;align-items:center;justify-content:space-between;padding:18px;background:linear-gradient(#000c,transparent)}.logo{font:600 19px Georgia,serif;letter-spacing:.28em}.top button,.camera-controls button{border:1px solid #ffffff42;background:#151515d9;color:#fff;min-width:40px;height:40px;border-radius:99px;font-size:13px}.camera-controls{display:flex;gap:7px}.camera-controls button{padding:0 12px;font-size:11px;font-weight:700}.camera-controls button:disabled{opacity:.45}.hint{position:absolute;z-index:4;top:104px;left:16px;right:16px;text-align:center;text-shadow:0 1px 12px #000}.hint b{display:block;font:26px Georgia,serif}.hint span{display:block;margin-top:5px;font-size:11px}.status{position:absolute;z-index:4;top:170px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:9px 13px;border:1px solid #ffffff2b;border-radius:99px;background:#111d;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.capture{display:none;position:absolute;z-index:5;right:18px;top:102px;border:0;border-radius:99px;background:#fff;color:#111;padding:11px 13px;font-size:10px;font-weight:800}.capture.show{display:block}.dock{position:absolute;z-index:6;bottom:0;inset-inline:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080808 21%,#080808)}.title{font-size:9px;letter-spacing:.14em;font-weight:800;color:#ddd;margin:0 4px 6px}.finger-row{display:flex;gap:5px;overflow:auto;padding:0 1px 7px;scrollbar-width:none}.finger-row button{flex:0 0 auto;border:1px solid #ffffff26;border-radius:99px;background:#1c1c1c;color:#ddd;padding:7px 10px;font-size:9px}.finger-row button.active{color:#1b1712;background:#f4d58d;border-color:#f4d58d;font-weight:800}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.product{border:1px solid transparent;border-radius:11px;background:#202020;color:#fff;text-align:left;padding:5px}.product.active{border-color:#d7b577;box-shadow:0 0 0 1px #d7b577}.product img{width:100%;height:48px;object-fit:contain;padding:2px;background:#fffdf9;border-radius:7px}.product b{display:block;margin:4px 1px 0;font:10px Georgia,serif}.product small{display:block;color:#aaa;margin:2px 1px 0;font-size:8px}.product .price{display:block;margin:4px 1px 4px;font-size:9px;font-weight:800;color:#f4d58d}.product .shop{display:block;border:1px solid #ffffff4d;border-radius:6px;padding:4px 3px;color:#fff;text-align:center;text-decoration:none;font-size:7px;font-weight:800;letter-spacing:.04em}.product .shop:active{background:#f4d58d;color:#181411}.action{width:100%;height:46px;margin-top:8px;border:0;border-radius:12px;background:#f8f5f0;color:#181411;font-size:12px;font-weight:800}.action.live{background:#8c1f3c;color:#fff}.sheet,.error{position:absolute;z-index:10;inset:auto 0 0;background:#f7f4ef;color:#171513;padding:19px 20px calc(20px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0}.sheet h1{font:29px Georgia,serif;margin:4px 0 9px}.sheet p,.error p{font-size:12px;line-height:1.5;color:#6b655e}.sheet button,.error button{width:100%;height:55px;border-radius:13px;border:0;background:#151515;color:#fff;font-weight:800}.error{display:none;left:14px;right:14px;bottom:170px;border-radius:18px;padding:18px}.error.show{display:block}
  </style>
</head>
<body>
<main class="app">
  <video id="video" class="screen" playsinline muted></video><canvas id="canvas" class="canvas"></canvas>
  <header class="top"><button id="reset" aria-label="Close try-on">×</button><div class="logo">MIA</div><div class="camera-controls"><button id="flash" disabled>FLASH</button><button id="switchCamera">REAR</button></div></header>
  <div class="hint" id="hint"><b>Try a MIA ring, live.</b><span>Choose a ring, then open the camera.</span></div>
  <div class="status" id="status">Choose a ring to begin</div><button id="capture" class="capture">SAVE FRAME</button>
  <section class="dock"><div class="title">CHOOSE A FINGER</div><div id="fingers" class="finger-row"></div><div class="title">SELECT YOUR RING</div><div id="products" class="products"></div><button id="action" class="action">Start virtual try-on</button></section>
  <section id="sheet" class="sheet"><h1>Try it on, live.</h1><p>Choose a ring and finger. Your camera opens only when you tap Start. The ring appears only after a real hand is locked.</p><button id="begin">Choose a ring</button></section>
  <section id="error" class="error"><b id="errorTitle">Camera unavailable</b><p id="errorCopy"></p><button id="retry">Try again</button></section>
</main>
<script type="module">
import{FilesetResolver,HandLandmarker}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';
const R=[
  {name:'Blue Crown',detail:'Gold · blue stone',card:'assets/mia-blue-crown-overlay-v3.svg?v=3',overlay:'assets/mia-blue-crown-overlay-v3.svg?v=3',fit:1.18,aspect:.46,price:'₹23,086',pdp:'https://www.miabytanishq.com/en_IN/blue-crown-diamond-and-gold-ring/553024fpvaa29.html'},
  {name:'Diamond Band',detail:'Gold · diamond',card:'assets/mia-diamond-band-overlay-v3.svg?v=3',overlay:'assets/mia-diamond-band-overlay-v3.svg?v=3',fit:1.16,aspect:.28,price:'₹76,060',pdp:'https://www.miabytanishq.com/en_IN/love-luck-diamond-and-gold-ring/553024fqn2a09.html'},
  {name:'Ribbed Band',detail:'Gold · diamond',card:'assets/mia-ribbed-band-overlay-v3.svg?v=3',overlay:'assets/mia-ribbed-band-overlay-v3.svg?v=3',fit:1.18,aspect:.30,price:'₹50,133',pdp:'https://www.miabytanishq.com/en_IN/heart-shine-diamond-and-gold-ring/553024frjaa09.html'}
],F={index:{label:'Index',mcp:5,pip:6},middle:{label:'Middle',mcp:9,pip:10},ring:{label:'Ring',mcp:13,pip:14},pinky:{label:'Pinky',mcp:17,pip:18}},$=s=>document.querySelector(s),video=$('#video'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),products=$('#products'),fingers=$('#fingers');
let selected=0,target='ring',assets=[],stream,tracker,started=false,last=0,session=0,facing='environment',torch=false,stable=0,misses=0,pose=null;
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr)}window.addEventListener('resize',resizeCanvas);
function load(url){const im=new Image();im.src=url;return im.decode().then(()=>im)}
function setStatus(text){$('#status').textContent=text}function showError(title,copy){$('#errorTitle').textContent=title;$('#errorCopy').textContent=copy;$('#error').classList.add('show')}
R.forEach((r,i)=>{const b=document.createElement('button');b.className='product'+(!i?' active':'');b.innerHTML=`<img src="${r.card}" alt="${r.name}"><b>${r.name}</b><small>${r.detail}</small><span class="price">${r.price}</span><a class="shop" href="${r.pdp}" target="_blank" rel="noopener" aria-label="Add ${r.name} to cart at Mia by Tanishq">ADD TO CART</a>`;b.onclick=()=>{selected=i;[...products.children].forEach((x,j)=>x.classList.toggle('active',j===i));if(started)setStatus('Changing to '+r.name+'…')};b.querySelector('.shop').onclick=e=>e.stopPropagation();products.append(b);assets.push(null);load(r.overlay).then(im=>assets[i]=im).catch(()=>setStatus('Ring asset unavailable — reload and try again'))});
Object.entries(F).forEach(([key,f])=>{const b=document.createElement('button');b.textContent=f.label;b.className=key===target?'active':'';b.onclick=()=>{target=key;pose=null;stable=0;[...fingers.children].forEach(x=>x.classList.toggle('active',x.textContent===f.label));if(started)setStatus('Looking for your '+f.label.toLowerCase()+' finger…')};fingers.append(b)});
function stopCamera(){session++;stream?.getTracks().forEach(t=>t.stop());stream=undefined;started=false;torch=false;pose=null;stable=0;misses=0;ctx.clearRect(0,0,canvas.width,canvas.height);$('#capture').classList.remove('show');$('#flash').disabled=true;$('#flash').textContent='FLASH'}
async function getStream(){const constraints={audio:false,video:{facingMode:{exact:facing},width:{ideal:1280},height:{ideal:720}}};try{return await navigator.mediaDevices.getUserMedia(constraints)}catch(e){return await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}})}}
async function ensureTracker(){if(tracker)return;const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');tracker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.72,minHandPresenceConfidence:.72,minTrackingConfidence:.65})}
function updateTorch(){const track=stream?.getVideoTracks?.()[0],has=Boolean(track?.getCapabilities?.().torch);$('#flash').disabled=!has;$('#flash').textContent=torch?'FLASH ON':'FLASH';return has}function updateCameraLabel(){$('#switchCamera').textContent=facing==='user'?'FRONT':'REAR'}
async function start(){try{stopCamera();$('#error').classList.remove('show');$('#sheet').style.display='none';$('#action').disabled=true;$('#action').textContent='Opening camera…';stream=await getStream();video.srcObject=stream;video.classList.toggle('mirrored',facing==='user');await video.play();resizeCanvas();await ensureTracker();started=true;updateTorch();$('#hint').innerHTML='<b>Show your whole hand.</b><span>Keep the selected finger relaxed and visible.</span>';setStatus('Looking for a real hand…');$('#action').textContent='Live try-on active';$('#action').classList.add('live');$('#action').disabled=false;$('#capture').classList.add('show');const current=++session;requestAnimationFrame(t=>render(t,current))}catch(e){stopCamera();$('#action').disabled=false;$('#action').textContent='Start virtual try-on';showError('Camera or AR setup unavailable',location.protocol==='file:'?'Camera access requires a secure HTTPS page.':'Allow camera access, then try again.')}}
async function switchCamera(){facing=facing==='user'?'environment':'user';updateCameraLabel();if(!started){setStatus(facing==='user'?'Front camera selected':'Rear camera selected');return}await start()}
async function toggleFlash(){const track=stream?.getVideoTracks?.()[0];if(!track?.getCapabilities?.().torch){setStatus('Flash is available on supported rear cameras');return}try{torch=!torch;await track.applyConstraints({advanced:[{torch}]});updateTorch()}catch(e){torch=false;updateTorch();setStatus('Flash could not be enabled on this camera')}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function validHand(result,p){const score=result.handednesses?.[0]?.[0]?.score??1,box=Math.max(...p.map(q=>q.y))-Math.min(...p.map(q=>q.y)),finger=F[target],palm=dist(p[0],p[9]),segment=dist(p[finger.mcp],p[finger.pip]),spread=dist(p[5],p[17]);return score>=.78&&box>=.20&&palm>=.095&&spread>=.09&&segment/palm>=.20&&segment/palm<=.75}
function lerpAngle(a,b,t){let d=(b-a+Math.PI)%(Math.PI*2)-Math.PI;return a+d*t}function smooth(next){if(!pose)return pose=next;const jump=Math.hypot(next.x-pose.x,next.y-pose.y),ratio=next.w/pose.w;if(jump>Math.max(next.w*1.05,pose.w*1.2)||ratio<.64||ratio>1.56)return null;const t=.24;pose={x:pose.x+(next.x-pose.x)*t,y:pose.y+(next.y-pose.y)*t,w:pose.w+(next.w-pose.w)*t,angle:lerpAngle(pose.angle,next.angle,t)};return pose}
function fingerSpan(points,key){const d=(a,b)=>Math.hypot(points[a].x-points[b].x,points[a].y-points[b].y);if(key==='index')return d(5,9);if(key==='middle')return(d(5,9)+d(9,13))/2;if(key==='ring')return(d(9,13)+d(13,17))/2;return d(13,17)*.82}
function render(time,id){if(!started||id!==session)return;requestAnimationFrame(t=>render(t,id));if(time-last<33)return;last=time;ctx.clearRect(0,0,canvas.width,canvas.height);const result=tracker.detectForVideo(video,time),p=result.landmarks?.[0];if(!p||!validHand(result,p)){stable=0;misses++;pose=null;setStatus('No hand lock — show your palm and fingers');return}misses=0;stable++;const f=F[target],scale=Math.max(canvas.width/video.videoWidth,canvas.height/video.videoHeight),ox=(canvas.width-video.videoWidth*scale)/2,oy=(canvas.height-video.videoHeight*scale)/2,map=q=>{const x=q.x*video.videoWidth*scale+ox;return{x:facing==='user'?canvas.width-x:x,y:q.y*video.videoHeight*scale+oy}},points=p.map(map),a=points[f.mcp],b=points[f.pip],axis=Math.hypot(b.x-a.x,b.y-a.y),im=assets[selected];if(stable<3){setStatus('Locking to your '+f.label.toLowerCase()+' finger…');return}if(!im?.complete){setStatus('Loading '+R[selected].name+'…');return}const fingerWidth=fingerSpan(points,target),width=Math.max(fingerWidth*1.04,Math.min(fingerWidth*1.24,fingerWidth*R[selected].fit)),center=.62,next={x:a.x+(b.x-a.x)*center,y:a.y+(b.y-a.y)*center,w:width,angle:Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2},q=smooth(next);if(!q){stable=0;pose=null;setStatus('Reframing selected finger…');return}const height=q.w*R[selected].aspect;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.angle);const depth=Math.max(3,height*.16);ctx.shadowColor='rgba(35,18,4,.48)';ctx.shadowBlur=Math.max(4,q.w*.045);ctx.shadowOffsetY=depth;ctx.drawImage(im,-q.w/2,-height/2,q.w,height);ctx.shadowColor='transparent';const shine=ctx.createLinearGradient(-q.w/2,0,q.w/2,0);shine.addColorStop(0,'rgba(255,226,151,.10)');shine.addColorStop(.5,'rgba(255,255,255,.32)');shine.addColorStop(1,'rgba(161,92,22,.10)');ctx.globalCompositeOperation='screen';ctx.fillStyle=shine;ctx.fillRect(-q.w*.43,-height*.12,q.w*.86,Math.max(1,height*.10));ctx.globalCompositeOperation='source-over';ctx.restore();setStatus(R[selected].name+' locked to your '+f.label.toLowerCase()+' finger')}
function saveFrame(){const out=document.createElement('canvas'),o=out.getContext('2d'),w=canvas.width,h=canvas.height;out.width=w;out.height=h;const s=Math.max(w/video.videoWidth,h/video.videoHeight),sw=w/s,sh=h/s,sx=(video.videoWidth-sw)/2,sy=(video.videoHeight-sh)/2;if(facing==='user'){o.translate(w,0);o.scale(-1,1);o.drawImage(video,sx,sy,sw,sh,0,0,w,h);o.setTransform(1,0,0,1,0,0)}else{o.drawImage(video,sx,sy,sw,sh,0,0,w,h)}o.drawImage(canvas,0,0);const a=document.createElement('a');a.download='mia-live-try-on.png';a.href=out.toDataURL('image/png');a.click()}
$('#begin').onclick=()=>{$('#sheet').style.display='none';setStatus('Choose a finger and start the camera')};$('#action').onclick=start;$('#retry').onclick=start;$('#switchCamera').onclick=switchCamera;$('#flash').onclick=toggleFlash;$('#capture').onclick=saveFrame;$('#reset').onclick=()=>{stopCamera();$('#sheet').style.display='block';$('#hint').innerHTML='<b>Try a MIA ring, live.</b><span>Choose a ring, then open the camera.</span>';setStatus('Choose a ring to begin');$('#action').textContent='Start virtual try-on';$('#action').classList.remove('live')};
</script>
</body></html>
