$('#begin').onclick=()=>{$('#sheet').classList.remove('show');$('#hint').innerHTML='<b>Select your ring.</b><span>Tap Start virtual try-on when ready.</span>'};$('#action').onclick=start;$('#reset').onclick=()=>{stop();$('#sheet').classList.add('show');$('#hint').innerHTML='<b>Try a MIA ring, live.</b><span>Select a ring. We’ll open your camera and fit it to your ring finger.</span>';$('#action').textContent='Start virtual try-on';$('#action').classList.remove('live')};$('#retry').onclick=start;$('#capture').onclick=()=>{let a=document.createElement('a');a.download='mia-live-try-on.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
